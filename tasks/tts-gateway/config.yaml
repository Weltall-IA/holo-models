host: 127.0.0.1
port: 5050
default_engine: magpie
device: cuda
load_policy: lazy

# OpenAI-compatible aliases routed to default_engine.
model_aliases:
  - tts-1
  - tts-1-hd
  - gpt-4o-mini-tts

response_formats:
  - wav
  - flac
  - mp3
  - pcm

chunking_enabled: true
chunk_chars: 1200
chunk_pause_ms: 120

engines:
  magpie:
    model_path: ${HOME}/Playstoria/models/audio/voz/nvidia-magpie_tts_multilingual_357m/magpie_tts_multilingual_357m.nemo
    default_speaker: Sofia
    default_language: pt
    device: auto
    sample_rate: 22050

  kokoro:
    model_path: ${HOME}/Playstoria/models/audio/voz/hexgrad-Kokoro-82M-ONNX/kokoro-v1.0.onnx
    voices_path: ${HOME}/Playstoria/models/audio/voz/hexgrad-Kokoro-82M-ONNX/voices-v1.0.bin
    default_voice: af_heart
    provider: CPUExecutionProvider
    sample_rate: 24000
    # Used only if the voices file cannot be inspected without loading the model.
    known_voices:
      - af_heart
      - af_alloy
      - af_aoede
      - af_bella
      - af_jessica
      - af_kore
      - af_nicole
      - af_nova
      - af_river
      - af_sarah
      - af_sky
      - am_adam
      - am_echo
      - am_eric
      - am_fenrir
      - am_liam
      - am_michael
      - am_onyx
      - am_puck
      - am_santa
      - bf_alice
      - bf_emma
      - bf_isabella
      - bf_lily
      - bm_daniel
      - bm_fable
      - bm_george
      - bm_lewis
