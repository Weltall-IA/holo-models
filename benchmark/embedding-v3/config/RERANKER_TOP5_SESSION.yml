schema_version: 1

session:
  id: RERANKER-TOP5-1
  title: Benchmark de rerankers nos cinco melhores embeddings brutos
  status: READY
  objective: >-
    Comparar rerankers somente sobre os cinco melhores modelos de embedding sem
    reranking, evitando gastar tempo com embeddings inferiores e evitando repetir
    combinações já concluídas.

repository:
  expected: Weltall-IA/holo-models
  root: /home/alpha/Playstoria/models

protocol:
  corpus:
    documents: 600
    queries: 150
    combined_sha256: 8e1b7a6dd6f51d98e1ffe1738b6a59498df24c49b2edca24850b838687dd149b
  candidate_top_k: 50
  rerank_top_k: 20
  preserve_same_queries: true
  preserve_same_documents: true
  preserve_same_instruction: true
  preserve_same_relevance_judgments: true
  vl_enabled: false

selection:
  source_of_truth:
    - benchmark/embedding-v3/results
    - benchmark/embedding-v3/BENCHMARK_RESULTS_REGISTRY.json
  population:
    include:
      - completed base embedding profiles on the frozen corpus
    exclude:
      - pipeline_variant
      - incomplete results
      - results from another corpus hash
      - models without a valid base ranking
  distinct_model_families: true
  duplicate_policy:
    exact_weight_aliases: select_one_canonical_profile
    identical_candidate_rankings: select_one_canonical_profile
    canonical_profile_preference:
      - commercially eligible
      - fully local
      - CUDA result
      - lower latency
      - lower VRAM
    record_excluded_aliases: true
  ranking_without_reranker:
    primary: mrr_at_10
    tie_breakers:
      - ndcg_at_10
      - hit_rate_at_1
      - hit_rate_at_10
      - lower_query_latency
      - lower_peak_vram
  select_count: 5
  materialize_selection_before_execution: true
  selection_output: benchmark/embedding-v3/results/reranker_top5/selected_embeddings.json

rerankers:
  include:
    - qwen_local
    - voyage_rerank_2_5
    - kalm_reranker_v1_nano
    - kalm_reranker_v1_small
    - querit_reranker_a043b
    - querit_reranker_4b
    - jina_reranker_v3_noncommercial
  eligibility:
    qwen_local:
      type: local
      production_eligible: true
    voyage_rerank_2_5:
      type: paid_api
      production_eligible: true
      missing_pipeline_calls_require_explicit_cost_approval: true
    kalm_reranker_v1_nano:
      type: local
      production_eligible: true
    kalm_reranker_v1_small:
      type: local
      production_eligible: true
    querit_reranker_a043b:
      type: local
      production_eligible: true
      precondition: checkpoint_and_smoke_test_pass
    querit_reranker_4b:
      type: local
      production_eligible: true
      precondition: official_scoring_audit_pass
    jina_reranker_v3_noncommercial:
      type: local
      production_eligible: false
      license: CC-BY-NC-4.0
  discovery:
    allow_additional_registered_rerankers: true
    require_explicit_identity: true
    never_use_generic_result_id: true

reuse_and_skip:
  skip_completed_pipeline: true
  completed_pipeline_sources:
    - benchmark/embedding-v3/results/reranker
    - benchmark/embedding-v3/RERANKER_PIPELINE_REPORT.md
    - benchmark/embedding-v3/BENCHMARK_RESULTS_REGISTRY.json
  voyage_rule: >-
    Não repetir Voyage rerank-2.5 para qualquer embedding selecionado que já possua
    resultado válido no mesmo corpus, top-k, instrução e revisão de API.
  general_rule: >-
    Não repetir nenhuma combinação embedding + reranker já concluída com protocolo
    equivalente. Reexecutar somente quando houver revisão nova, correção documentada
    de scoring/adaptador, artefato inválido ou autorização explícita para auditoria.
  reuse_candidates_top_50: true
  recalculate_embeddings: false

execution:
  order:
    - validate_repository_and_governance
    - ingest_existing_raw_results
    - materialize_top_5_base_selection
    - enumerate_missing_pipeline_matrix
    - validate_each_reranker
    - execute_only_missing_local_pipelines
    - request_cost_approval_only_for_missing_voyage_pipelines
    - execute_authorized_missing_voyage_pipelines
    - generate_final_comparison
    - append_registry
  failure_policy:
    create_random_head: false
    silently_skip: false
    mark_not_applicable: false
    correction_cycle:
      - identify_real_failure
      - correct_loader_runtime_or_checkpoint
      - run_deterministic_smoke_test
      - rerun_affected_pipeline
  resource_policy:
    sequential_models: true
    clear_ram_vram_between_models: true
    reduce_batch_before_changing_protocol: true

metrics:
  required:
    - hit_rate_at_1
    - hit_rate_at_3
    - hit_rate_at_5
    - hit_rate_at_10
    - hit_rate_at_20
    - mrr_at_10
    - ndcg_at_10
    - hard_negative_error
    - rescue_count
    - rescue_rate
    - damage_count
    - damage_rate
    - latency_p50_seconds
    - latency_p95_seconds
    - latency_max_seconds
    - total_seconds
    - peak_ram_bytes
    - peak_vram_bytes
  rank_final_by:
    - mrr_at_10
    - ndcg_at_10
    - hit_rate_at_1
    - hit_rate_at_10
    - lower_damage_rate
    - lower_latency_p95_seconds
    - lower_peak_vram_bytes

outputs:
  directory: benchmark/embedding-v3/results/reranker_top5
  required:
    - selected_embeddings.json
    - existing_pipeline_matrix.json
    - missing_pipeline_matrix.json
    - scores
    - pipelines
    - RERANKER_TOP5_REPORT.md
  update_registry:
    path: benchmark/embedding-v3/BENCHMARK_RESULTS_REGISTRY.json
    mode: append_only
    require_real_execution: true
  final_status_contract:
    selected_embeddings: 5
    local_missing_pipelines: all_completed
    voyage_existing_pipelines: reused
    voyage_missing_pipelines: completed_if_authorized_otherwise_explicitly_pending_cost_approval
    pending_technical_errors: 0
    vl_started: false

completion:
  do_not_return_partial_report: true
  report:
    - five_selected_embeddings_and_base_metrics
    - skipped_existing_pipelines
    - newly_executed_pipelines
    - best_pipeline_per_reranker
    - best_quality_pipeline
    - best_fully_local_commercial_pipeline
    - best_efficiency_pipeline
    - noncommercial_results_separate
    - unresolved_paid_api_combinations_separate
