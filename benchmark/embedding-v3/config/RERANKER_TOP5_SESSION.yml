schema_version: "1.0"
session: "reranker_top5"

description: >
  Sessão de reranking local aplicada às 5 melhores famílias de embeddings.
  Colapso por família (mantido modelo nativo) selecionado por MRR@10 sobre o corpus
  holo_fake_scenes_v3 (600 docs, 150 queries). Candidatos top 50 reutilizados;
  embeddings não recalculados.

selected_embeddings:
  criteria: "MRR@10 descending on raw benchmark results, collapsed by family"
  top_n: 5
  families_collapsed:
    - family: gemma
      models: [embeddinggemma, embeddinggemma_gguf]
      selected: embeddinggemma (native)
    - family: perplexity
      models: [pplx_embed_v1_06b_native, pplx_embed_v1_4b_q8_0]
      selected: pplx_embed_v1_4b_q8_0 (4B GGUF)
    - family: voyage
      models: [voyage4_nano]
      selected: Excluded (API dependency)
    - family: nomic
      models: [nomic_embed_text_v2_moe_q4]
      selected: nomic_embed_text_v2_moe_q4
    - family: bge
      models: [bge_m3_dense]
      selected: bge_m3_dense
    - family: snowflake
      models: [snowflake_arctic_embed_l_v2_q4]
      selected: snowflake_arctic_embed_l_v2_q4
  embeddings:
    - id: embeddinggemma
      family: gemma
      source: gate2
      mrr10: 0.7562
      hr10: 0.8600
      ndcg10: 0.7739
    - id: pplx_embed_v1_4b_q8_0
      family: perplexity
      source: gate3
      mrr10: 0.7562
      hr10: 0.8600
      ndcg10: 0.7778
    - id: nomic_embed_text_v2_moe_q4
      family: nomic
      source: gate3
      mrr10: 0.7420
      hr10: 0.8333
      ndcg10: 0.7562
    - id: bge_m3_dense
      family: bge
      source: gate2
      mrr10: 0.7182
      hr10: 0.8800
      ndcg10: 0.7490
    - id: snowflake_arctic_embed_l_v2_q4
      family: snowflake
      source: gate3
      mrr10: 0.7113
      hr10: 0.8600
      ndcg10: 0.7394

local_rerankers:
  - id: qwen_local
    model: Qwen3-Reranker-0.6B
    path: rerank/qwen3_reranker_06
    type: cross_encoder
  - id: kalm_reranker_v1_nano
    model: KaLM-Reranker-V1-Nano
    path: rerank/kalm_reranker_v1_nano
    type: encoder_decoder
  - id: kalm_reranker_v1_small
    model: KaLM-Reranker-V1-Small
    path: rerank/kalm_reranker_v1_small
    type: encoder_decoder
  - id: jina_reranker_v3_noncommercial
    model: jina-reranker-v3
    path: rerank/jina_reranker_v3_noncommercial
    type: causal_lm_projector
  - id: querit_reranker_4b
    model: Querit-4B
    path: rerank/querit_reranker_4b
    type: causal_lm_head
    scoring_note: "score = P(no) - P(yes); descending sort for ranking"

rules:
  - "Reutilizar candidatos top 50 salvos; não recalcular embeddings"
  - "5 famílias distintas: gemma, perplexity, nomic, bge, snowflake"
  - "Não repetir pipelines já concluídos"
  - "Processar rerankers sequencialmente, limpando RAM/VRAM entre eles"
  - "Corrigir falhas de loader e repetir até concluir"
  - "Não aceitar pesos inicializados aleatoriamente"
  - "Não iniciar benchmark VL"
  - "Reutilizar resultados Voyage existentes"
  - "Não fazer novas chamadas pagas ao Voyage"
