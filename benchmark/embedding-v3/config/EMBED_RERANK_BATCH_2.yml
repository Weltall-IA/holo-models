      --revision b01800d7eba04db105a8ef88a8be61dbac047b0b
      --local-dir embed/bitnet_270m_current
    backend: bitnet.cpp
    executable: llama-embedding
    native_dimension: 640
    evaluated_dimension: 640
    pooling: last_non_padding_token
    normalization: l2
    query_instruction: >-
      query: Given a query, retrieve scenes that answer it by matching events,
