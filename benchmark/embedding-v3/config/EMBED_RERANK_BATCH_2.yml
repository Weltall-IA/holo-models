voyage:
  status: DISABLED_PENDING_EXPLICIT_COST_APPROVAL
  rules:
    - do not call Voyage embedding or rerank APIs in this session
    - after all local phases, report exact proposed profiles and token/cost estimate
    - require new explicit human approval

resource_and_cache_policy:
  process_per_model: true
  clear_between_models:
    - garbage_collect
    - torch_cuda_empty_cache
    - terminate_model_servers
    - verify_no_stale_gpu_process
  cache_key_required_fields:
    - profile_id
    - weight_sha256
    - runtime_version
    - quantization
    - dimension
    - pooling
    - normalization
    - query_prompt
    - document_prompt
    - corpus_sha256
  prohibited:
    - fallback to another model under the same profile ID
    - copy or rename candidate files to simulate execution
    - reuse candidates across different weight hashes
    - silently truncate dimensions without L2 renormalization
    - mix embedding-only and reranked metrics
    - execute Voyage without explicit approval
    - fabricate metrics

outputs:
  baselines: benchmark/embedding-v3/results/<appropriate-source>/<profile-id>.json
  candidates: benchmark/embedding-v3/results/reranker/candidates/<profile-id>.json
  pipelines: benchmark/embedding-v3/results/reranker/pipelines/<reranker-id>/<profile-id>.json
  canonical:
    - benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json
    - benchmark/embedding-v3/README.md
  final_diff_rules:
    - include only real results, required code/config changes and canonical documentation
    - remove temporary scripts and inventories
    - do not create another leaderboard, registry, blacklist or duplicate report

validation:
  required:
    - corpus hash unchanged
    - all new JSON and YAML files parse
    - every new profile has complete identity and protocol metadata
    - embedding-only and reranked metrics remain separated
    - candidate query order matches the frozen 150-query order
    - no duplicate profile IDs
    - no blocked or audit-required result appears in the good table
    - canonical counts and rankings are regenerated from real artifacts
    - README tables are updated once
    - python .ai/validate_governance.py
    - python -m unittest discover -s benchmark/embedding-v3/tests -v
    - python -m compileall -q benchmark/embedding-v3
    - python benchmark/embedding-v3/validate_coverage.py
    - git diff --check
    - full diff review

small_phase_stop_contract:
  stop_after:
    - all existing missing Qwen-local pipelines attempted
    - LFM2.5 350M Q4 baseline complete or explicitly blocked
    - BitNet 270M baseline complete or explicitly blocked
    - BitNet 0.6B baseline complete or explicitly blocked
    - Qwen local executed only for small embeddings that pass the gate
    - mxbai reranker panel complete or explicitly blocked
    - NVIDIA Nemotron reranker 1B panel complete or explicitly blocked
    - canonical files updated from real artifacts
    - feature branch committed, pushed and PR opened
  must_not_start:
    - any heavy_phase_researched_but_do_not_run_now model
    - Voyage API

completion_report:
  required:
    - models reused without execution
    - exact downloads performed with revision, file size and SHA-256
    - quantizations selected and rejected
    - smoke-test results
    - small baselines and comparison with historical artifacts
    - small embeddings that passed or failed reranker gate
    - new Qwen pipelines
    - mxbai and NVIDIA 1B reranker panel ranking
    - latency, throughput, RAM, VRAM, rescue and damage
    - heavy phase still pending
    - Voyage still pending approval
    - exact changed files, commit and PR URL
