bitnet_build:
  repository: https://github.com/microsoft/BitNet.git
  build_once_before_both_models: |
    git clone --recursive https://github.com/microsoft/BitNet.git runtimes/BitNet
    cmake -S runtimes/BitNet -B runtimes/BitNet/build \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_C_COMPILER=clang \
      -DCMAKE_CXX_COMPILER=clang++ \
      -DGGML_NATIVE=ON \
      -DGGML_OPENMP=OFF \
      -DLLAMA_BUILD_COMMON=ON \
      -DLLAMA_BUILD_TOOLS=ON \
      -DLLAMA_BUILD_EXAMPLES=ON
    cmake --build runtimes/BitNet/build \
      --target llama-embedding llama-bench -j"$(nproc)"
  inference_template: >-
    runtimes/BitNet/build/bin/llama-embedding -m MODEL.gguf
    -p "QUERY_OR_DOCUMENT_TEXT" --embd-normalize 2
    --embd-output-format array
  record:
    - BitNet git commit
    - compiler versions
    - CMake flags
    - binary SHA-256

small_embedding_gate_to_qwen:
  default:
    hit_rate_at_50_minimum: 0.9666666667
    queries_without_relevant_maximum: 5
    require_valid_provenance: true
    require_unique_candidate_artifact: true
  efficiency_exception:
    allowed_profiles:
      - bitnet_270m_current
      - bitnet_06b_current
    hit_rate_at_50_minimum: 0.94
  fail_action:
    - preserve baseline result
    - update canonical blacklist or blocked reason
    - do not execute rerankers for the failed embedding
  pass_action:
    - generate top 50 candidates
    - run existing qwen_local
    - record rescue, damage, latency, RAM, VRAM and errors

small_rerankers_run_now:
  fixed_panel_embeddings:
    - nemotron_3_embed_1b_nvfp4
    - nomic_embed_text_v2_moe_q4
    - qwen3_embedding_4b_q8_0
    - embeddinggemma
    - colibri_ptbr
    - granite_embedding_311m_r2

  models:
    - order: 4
      id: mxbai_rerank_base_v2
      parameters: 0.5B
      quantization_selection:
        nvfp4_found: false
        q4_found: false
        selected: native_safetensors
        exception: model_at_most_1B
      repository: mixedbread-ai/mxbai-rerank-base-v2
      model_page: https://huggingface.co/mixedbread-ai/mxbai-rerank-base-v2
      files_page: https://huggingface.co/mixedbread-ai/mxbai-rerank-base-v2/tree/main
      primary_weight_file: model.safetensors
      expected_weight_size_bytes_approx: 988000000
      expected_weight_sha256: c01649fe56b3fe32e52da43c69e084dff7c2252cf231a38c56d5a291a674338f
      download_command: >-
        hf download mixedbread-ai/mxbai-rerank-base-v2
        --local-dir rerank/mxbai_rerank_base_v2
      backend: sentence-transformers.CrossEncoder
      install_command: pip install -U sentence-transformers
      scoring:
        method: CrossEncoder.predict_or_rank
        output: raw_score
        sort: descending
      anti_error_rules:
        - load the complete repository, not only model.safetensors
        - use query-document pairs
        - do not use text generation
        - record tokenizer maximum length and truncation
        - produce exactly one finite score per pair
        - preserve candidate order when mapping scores

    - order: 5
      id: llama_nemotron_rerank_1b_v2
      parameters: 1B
      quantization_selection:
        nvfp4_found: false
        q4_found: false
        selected: native_BF16_safetensors
        exception: model_at_most_1B
      repository: nvidia/llama-nemotron-rerank-1b-v2
      model_page: https://huggingface.co/nvidia/llama-nemotron-rerank-1b-v2
      files_page: https://huggingface.co/nvidia/llama-nemotron-rerank-1b-v2/tree/main
      primary_weight_file: model.safetensors
      expected_weight_size_bytes_approx: 2470000000
      expected_weight_sha256: 7d60ff24db62fe6a639c4c6f4aeac3a3b32ed20939ab72a0be4b019c2219e5e0
      download_command: >-
        hf download nvidia/llama-nemotron-rerank-1b-v2
        --local-dir rerank/llama_nemotron_rerank_1b_v2
      backend: vllm
      minimum_vllm: 0.14.0
      installed_reference_vllm: 0.25.0
      trust_remote_code: true
      runner: pooling
      required_score_template_file: rerank/nemotron-rerank.jinja
      create_template_command: |
        python3 - <<'PY'
        template = (
            'question:{{ (messages | selectattr("role", "eq", "query") | first).content }}'
            '\n\n'
            'passage:{{ (messages | selectattr("role", "eq", "document") | first).content }}'
        )
        open('rerank/nemotron-rerank.jinja', 'w', encoding='utf-8').write(template)
        PY
      serve_command: >-
        vllm serve rerank/llama_nemotron_rerank_1b_v2
        --trust-remote-code --runner pooling
        --chat-template rerank/nemotron-rerank.jinja
      anti_error_rules:
        - score template is mandatory; without it results are incorrect
        - use LLM.score or the official rerank endpoint
        - do not use text generation
        - preserve returned document indices
        - record raw relevance_score without sign inversion
        - verify native precision fits with at least 3 GiB free VRAM after load

  expected_new_panel_pipelines: 12
  panel_rules:
    - use identical candidates for comparisons against qwen_local
    - rank by MRR@10, nDCG@10, HR@1, HR@10, damage, p95 latency and VRAM
    - no reranker is promoted by public reputation alone

heavy_phase_researched_but_do_not_run_now:
  - order_later: 1
    id: qwen3_reranker_4b
    kind: reranker
    primary_selection:
      quantization: NVFP4
      repository: throwerdopey0/Qwen3-Reranker-4B-seq-cls-NVFP4
      model_page: https://huggingface.co/throwerdopey0/Qwen3-Reranker-4B-seq-cls-NVFP4
      download_command: >-
        hf download throwerdopey0/Qwen3-Reranker-4B-seq-cls-NVFP4
        --local-dir rerank/qwen3_reranker_4b_nvfp4
      backend: vllm_0.25_pooling
      note: >-
        Third-party NVFP4 with disclosed MS MARCO calibration and official Qwen
        prompt layout. Must pass lineage, SHA and deterministic scoring checks.
    fallback_selection:
      quantization: Q4_K_M
      repository: mradermacher/Qwen3-Reranker-4B-GGUF
      model_page: https://huggingface.co/mradermacher/Qwen3-Reranker-4B-GGUF
      file_page: https://huggingface.co/mradermacher/Qwen3-Reranker-4B-GGUF/blob/main/Qwen3-Reranker-4B.Q4_K_M.gguf
      file: Qwen3-Reranker-4B.Q4_K_M.gguf
      expected_size_bytes_approx: 2500000000
      expected_sha256: 143cbc3a4b2ebbd0b4022931c22a257c1c501cf20eeae0e65b1131183506ce65
      download_command: >-
        hf download mradermacher/Qwen3-Reranker-4B-GGUF
        Qwen3-Reranker-4B.Q4_K_M.gguf
        --local-dir rerank/qwen3_reranker_4b_q4_k_m
    official_scoring_reference: https://huggingface.co/Qwen/Qwen3-Reranker-4B
    scoring_rules:
      - use the official CrossEncoder or verified yes/no logit method
      - use an English task instruction
      - never rank arbitrary generated text
      - do not invert yes/no scoring signs

  - order_later: 2
    id: boom_4b_v1_q4_k_m_retest
    kind: embedding
    nvfp4_search_result: no trustworthy public NVFP4 located
    selected_quantization: Q4_K_M
    repository: mradermacher/BOOM_4B_v1-GGUF
    base_model: ICT-TIME-and-Querit/BOOM_4B_v1
    model_page: https://huggingface.co/mradermacher/BOOM_4B_v1-GGUF
    file: BOOM_4B_v1.Q4_K_M.gguf
    expected_size_bytes_approx: 2500000000
    download_command: >-
      hf download mradermacher/BOOM_4B_v1-GGUF
      BOOM_4B_v1.Q4_K_M.gguf
      --local-dir embed/boom_4b_v1_q4_k_m_retest
    pooling: last_non_padding_token
    normalization: l2
    prompt_source: model_task_prompts
    rules:
      - resolve and record exact file SHA-256 before execution
      - use left padding when applicable
      - apply the model-provided retrieval instruction only to queries
      - never reuse the historical Q8 candidates

  - order_later: 3
    id: qwen3_embedding_8b_audit
    kind: embedding
    historical_q8_status: AUDIT_REQUIRED
    primary_selection:
      quantization: NVFP4
      repository: alexliap/Qwen3-Embedding-8B-NVFP4
      revision: 87db878af528bc425041f059887097d40191e05a
      model_page: https://huggingface.co/alexliap/Qwen3-Embedding-8B-NVFP4
      files_page: https://huggingface.co/alexliap/Qwen3-Embedding-8B-NVFP4/tree/main
      download_command: >-
        hf download alexliap/Qwen3-Embedding-8B-NVFP4
        --revision 87db878af528bc425041f059887097d40191e05a
        --local-dir embed/qwen3_embedding_8b_nvfp4_audit
      backend: vllm_0.25_compressed_tensors
      provenance_note: >-
        Disclosed llmcompressor recipe, but calibration used 100 Greek Aya samples.
        Treat as an auditable third-party quant, not an official Qwen release.
    q4_control:
      quantization: Q4_K_M
      repository: Qwen/Qwen3-Embedding-8B-GGUF
      revision: 90f57aa3f809935cd1a85cc0c391d3b23a3bc71c
      model_page: https://huggingface.co/Qwen/Qwen3-Embedding-8B-GGUF
      file_page: https://huggingface.co/Qwen/Qwen3-Embedding-8B-GGUF/blob/90f57aa3f809935cd1a85cc0c391d3b23a3bc71c/Qwen3-Embedding-8B-Q4_K_M.gguf
      file: Qwen3-Embedding-8B-Q4_K_M.gguf
      expected_size_bytes_approx: 4680000000
      expected_sha256: 758749433c7954543f308a2bf850e4238c57aeb64834ee36ca6b3b57d33a147c
      download_command: >-
        hf download Qwen/Qwen3-Embedding-8B-GGUF
        Qwen3-Embedding-8B-Q4_K_M.gguf
        --revision 90f57aa3f809935cd1a85cc0c391d3b23a3bc71c
        --local-dir embed/qwen3_embedding_8b_q4_k_m_audit
    dimensions: [4096, 1024]
    pooling: last_non_padding_token
