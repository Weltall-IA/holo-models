schema_version: 3

session:
  id: EMBED-RERANK-BATCH-2
  title: Benchmarks pequenos primeiro e auditoria pesada posterior
  status: READY_SMALL_PHASE
  researched_at: "2026-07-27"
  objective: >-
    Reutilizar resultados válidos, executar agora os embeddings e rerankers leves,
    registrar resultados completos e parar antes dos modelos pesados. Os modelos
    pesados já ficam pesquisados e especificados para a rodada posterior. Nenhuma
    API paga pode ser chamada nesta sessão.

repository:
  expected: Weltall-IA/holo-models
  root_expected: /home/alpha/Playstoria/models
  required_before_execution:
    - confirm remote is exactly Weltall-IA/holo-models
    - read AGENTS.md
    - read .ai/PROJECT.yml
    - read .ai/WORKFLOW.yml completely
    - read benchmark/embedding-v3/AGENTS.md
    - read benchmark/embedding-v3/README.md
    - inspect branch, status, worktrees, stashes and untracked files
    - preserve all pre-existing local work
    - create a feature branch; never edit master directly

hardware:
  gpu: NVIDIA RTX 5060 Ti 16 GB
  cpu: AMD Ryzen 7 2700X
  ram_gib: 31
  known_runtimes:
    llama_cpp: "9972 (c92e806d1)"
    vllm: "0.25.0"
  mandatory_rules:
    - execute one model at a time
    - terminate stale servers before the next model
    - clear RAM and VRAM between models
    - never silently fall back from CUDA to CPU
    - reduce batch size before changing protocol
    - record actual driver, CUDA, runtime and build versions
    - do not start a full benchmark until the deterministic smoke test passes

protocol:
  corpus:
    documents: 600
    queries: 150
    combined_sha256: 8e1b7a6dd6f51d98e1ffe1738b6a59498df24c49b2edca24850b838687dd149b
  candidate_top_k: 50
  rerank_top_k: 20
  device: cuda
  vl_enabled: false
  preserve:
    same_queries: true
    same_documents: true
    same_relevance_judgments: true
    same_rerank_instruction: true
  embedding_metrics_required:
    - hit_rate_at_1
    - hit_rate_at_3
    - hit_rate_at_5
    - hit_rate_at_10
    - hit_rate_at_20
    - hit_rate_at_50
    - mrr_at_10
    - ndcg_at_10
    - hard_negative_error_rate
    - queries_without_relevant
  runtime_metrics_required:
    - load_seconds
    - document_encode_seconds
    - query_encode_seconds
    - documents_per_second
    - queries_per_second
    - total_seconds
    - peak_ram_bytes
    - peak_vram_bytes
  identity_required:
    - profile_id
    - repository
    - immutable_revision
    - exact_weight_file
    - file_size_bytes
    - sha256
    - license
    - backend
    - backend_version
    - dtype_or_quantization
    - native_dimension
    - evaluated_dimension
    - pooling
    - normalization
    - query_prefix_or_prompt
    - document_prefix_or_prompt
    - command_or_endpoint

quantization_policy:
  mandatory_preference_order:
    - NVFP4 for the exact model when provenance and runtime support are trustworthy
    - Q4_K_M
    - another trustworthy Q4
  q8_or_native_exception:
    allowed_only_when_all:
      - no trustworthy NVFP4 exists for the exact model and revision
      - no trustworthy Q4 exists for the exact model and revision
      - model has at most 1B parameters
      - projected peak VRAM including runtime buffers is at most 12 GiB
      - exception is explicitly listed in this contract
      - actual peak VRAM is recorded
    otherwise: BLOCKED
  architecture_native_exception:
    - BitNet I2_S is allowed because it is the official architecture-native format
  prohibitions:
    - do not download or rerun a model larger than 1B in Q8
    - do not substitute FP16 or BF16 for a large model when NVFP4 or Q4 exists
    - do not confuse NVFP4 from another model size or revision
    - do not use third-party quantization without lineage, exact file and SHA-256
    - do not change quantization silently after a load failure

canonical_sources:
  numerical:
    - benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json
    - benchmark/embedding-v3/results
  human_decisions: benchmark/embedding-v3/README.md
  rules:
    - never estimate missing metrics
    - never reuse candidates across different weight hashes
    - never inherit results through unproven aliases
    - do not create another leaderboard, registry or blacklist
    - update only the two canonical README tables after real results exist

existing_results:
  expected_before_batch:
    embedding_only_profiles: 36
    reranked_pipelines: 89
  do_not_retest_valid_baselines:
    - embeddinggemma
    - pplx_embed_v1_4b_q8_0
    - voyage4_nano
    - nomic_embed_text_v2_moe_q4
