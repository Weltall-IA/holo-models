    document_prompt: ""
    anti_error_rules:
      - do not use the legacy GGUF that failed with TYPE_IQ4_NL_4_4
      - use the current Microsoft BitNet repository
      - use llama-embedding, not llama-cli and not a generation server
      - apply instruction only to queries
      - verify output dimension is exactly 640

  - order: 3
    profile_id: bitnet_06b_current
    kind: embedding
    parameters: 0.6B
    selected_quantization: official_I2_S
