execution_order:
  run_now_small_phase:
    - validate_repository_governance_hardware_and_inventory
    - materialize_missing_qwen_candidates_from_existing_valid_artifacts
    - run_missing_qwen_local_pipelines_without_new_model_downloads
    - benchmark_lfm_350m_q4
    - build_current_bitnet_cpp_once
    - benchmark_bitnet_270m_i2s
    - benchmark_bitnet_06b_i2s
    - gate_new_small_embeddings_for_qwen_local
    - run_qwen_local_for_small_embeddings_that_pass
    - benchmark_mxbai_rerank_base_v2_on_fixed_panel
    - benchmark_nvidia_nemotron_rerank_1b_v2_on_fixed_panel
    - regenerate_canonical_results_and_readme
