    - ict_querit_embedding_v1_until_quant_exists
    - voyage_api

phase_0_preflight_and_existing_work:
  assertions:
    - corpus hash and counts match the frozen protocol
    - ALL_BENCHMARK_RESULTS has 36 embedding-only profiles before execution
    - ALL_BENCHMARK_RESULTS has 89 reranked pipelines before execution
    - no blocked or audit-required profile participates in production selection
  missing_qwen_local_without_download:
    mandatory:
      - profile: nemotron_3_embed_1b_nvfp4
        candidate_source: existing full-corpus admission artifact
      - profile: nemotron_3_embed_1b_q4_k_m_gguf
        candidate_source: existing full-corpus admission artifact
      - profile: voyage-context-4
        candidate_source: existing checkpoints or per-query rankings
        prohibition: do not call the Voyage embedding API again
    conditional:
      - profile: voyage-4-large
        run_only_if: alias audit does not prove equivalence to voyage_4_large_1024_float32
    candidate_acceptance:
      - exactly 150 ordered queries
      - at least top 50 candidates per query
      - frozen corpus hash matches
      - source artifact and normalized ranking hash are recorded

small_phase_artifacts:
  - order: 1
    profile_id: lfm_25_embedding_350m_q4_k_m_official
    kind: embedding
    parameters: 350M
    selected_quantization: Q4_K_M
    selection_reason: official Q4 exists; preferred over Q8 and BF16
    repository: LiquidAI/LFM2.5-Embedding-350M-GGUF
    model_page: https://huggingface.co/LiquidAI/LFM2.5-Embedding-350M-GGUF
    file_page: https://huggingface.co/LiquidAI/LFM2.5-Embedding-350M-GGUF/blob/main/LFM2.5-Embedding-350M-Q4_K_M.gguf
    file: LFM2.5-Embedding-350M-Q4_K_M.gguf
    expected_size_bytes_approx: 229000000
    expected_sha256: 4d7aa9dc6406a10fc3dec2c11f8f06781af063bf49211b8e4132e9b876d3f32a
    download_command: >-
      hf download LiquidAI/LFM2.5-Embedding-350M-GGUF
      LFM2.5-Embedding-350M-Q4_K_M.gguf
      --local-dir embed/lfm_25_embedding_350m_q4_k_m_official
    backend: llama.cpp
    server_requirements:
      - use --embedding or --embeddings according to the installed llama.cpp build
      - use explicit CLS pooling; do not rely on an unverified automatic pooling value
      - use CUDA offload and record the command
    native_dimension: 1024
    evaluated_dimension: 1024
    pooling: cls
    normalization: l2
    query_prefix: "query: "
    document_prefix: "document: "
    max_tokens: 512
    anti_error_rules:
      - this is the embedding repository, not LiquidAI/LFM2.5-350M text generation
      - do not use the ColBERT model
      - apply query and document prefixes asymmetrically
      - verify returned dimension is exactly 1024
      - reject zero-norm or non-finite vectors
      - never reuse candidates from lfm_25_embedding_350m_q4
    smoke_test:
      documents: 20
      queries: 10
      requirements:
        - server starts on CUDA
        - 1024 finite L2-normalized values per vector
        - relevant pair scores above obvious unrelated controls
        - no identical vector for distinct inputs

  - order: 2
    profile_id: bitnet_270m_current
    kind: embedding
    parameters: 270M
    selected_quantization: official_I2_S
    selection_reason: official architecture-native 1.58-bit format
    repository: microsoft/bitnet-embedding-270m
    model_page: https://huggingface.co/microsoft/bitnet-embedding-270m
    file_page: https://huggingface.co/microsoft/bitnet-embedding-270m/blob/main/bitnet-embeddings-270m-bf16-i2_s.gguf
    revision: b01800d7eba04db105a8ef88a8be61dbac047b0b
    file: bitnet-embeddings-270m-bf16-i2_s.gguf
    expected_size_bytes: 367000000
    expected_sha256: 8ee5ae971b103cd55758934be54e5c9f7cc2b58b15890615acce8e649988c751
    download_command: >-
      hf download microsoft/bitnet-embedding-270m
