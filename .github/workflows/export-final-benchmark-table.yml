name: Export compact final benchmark table

on:
  push:
    branches:
      - agent/fix-consolidated-reranked-metrics
    paths:
      - .github/workflows/export-final-benchmark-table.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-consolidated-reranked-metrics
      - name: Export compact table data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          raw = data['raw_embedding_profiles_ranked_by_mrr_at_10']
          pipelines = data.get('pipelines_ranked_by_mrr_at_10') or data.get('published_pipelines_ranked_by_mrr_at_10')

          best = {}
          for pipeline in pipelines:
              embedding = pipeline['embedding']
              best.setdefault(embedding, pipeline)

          rerankers = {}
          for pipeline in pipelines:
              key = pipeline['reranker']
              bucket = rerankers.setdefault(key, {'count': 0, 'mrr_sum': 0.0, 'best': pipeline})
              bucket['count'] += 1
              bucket['mrr_sum'] += pipeline['metrics']['mrr_at_10']
              if pipeline['metrics']['mrr_at_10'] > bucket['best']['metrics']['mrr_at_10']:
                  bucket['best'] = pipeline
          for key, bucket in rerankers.items():
              bucket['mean_mrr_at_10'] = bucket.pop('mrr_sum') / bucket['count']
              bucket['best'] = {
                  'pipeline_id': bucket['best']['pipeline_id'],
                  'mrr_at_10': bucket['best']['metrics']['mrr_at_10'],
              }

          out = {
              'validation': data['validation'],
              'canonical_scope': data['canonical_scope'],
              'raw_profiles': [
                  {
                      'rank': x['rank_by_mrr_at_10'],
                      'profile_id': x['profile_id'],
                      'source_group': x['source_group'],
                      'mrr_at_10': x['metrics']['mrr_at_10'],
                      'hit_rate_at_1': x['metrics']['hit_rate_at_1'],
                      'hit_rate_at_10': x['metrics']['hit_rate_at_10'],
                      'ndcg_at_10': x['metrics']['ndcg_at_10'],
                      'documents_per_second': x['runtime'].get('documents_per_second'),
                      'queries_per_second': x['runtime'].get('queries_per_second'),
                      'load_seconds': x['runtime'].get('load_seconds'),
                      'peak_vram_mib': x['runtime'].get('peak_vram_mib'),
                      'peak_ram_mib': x['runtime'].get('peak_ram_mib'),
                  }
                  for x in raw
              ],
              'best_reranked_by_embedding': [
                  {
                      'rank_global': p['rank_by_mrr_at_10'],
                      'embedding': p['embedding'],
                      'reranker': p['reranker'],
                      'pipeline_id': p['pipeline_id'],
                      'mrr_at_10': p['metrics']['mrr_at_10'],
                      'hit_rate_at_1': p['metrics']['hit_rate_at_1'],
                      'hit_rate_at_10': p['metrics']['hit_rate_at_10'],
                      'ndcg_at_10': p['metrics']['ndcg_at_10'],
                  }
                  for p in sorted(best.values(), key=lambda p: p['rank_by_mrr_at_10'])
              ],
              'top_20_reranked_pipelines': [
                  {
                      'rank': p['rank_by_mrr_at_10'],
                      'pipeline_id': p['pipeline_id'],
                      'embedding': p['embedding'],
                      'reranker': p['reranker'],
                      'mrr_at_10': p['metrics']['mrr_at_10'],
                      'hit_rate_at_1': p['metrics']['hit_rate_at_1'],
                      'hit_rate_at_10': p['metrics']['hit_rate_at_10'],
                      'ndcg_at_10': p['metrics']['ndcg_at_10'],
                  }
                  for p in pipelines[:20]
              ],
              'reranker_summary': rerankers,
              'leaders_raw': data['leaders_raw'],
              'leaders_reranked': data['leaders_published'],
              'operational_comparison': data.get('operational_comparison'),
              'final_smoke_test': data.get('final_smoke_test'),
          }
          Path('benchmark/embedding-v3/TEMP_FINAL_TABLE.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit compact export
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark/embedding-v3/TEMP_FINAL_TABLE.json
          git commit -m "chore: export compact final benchmark table"
          git push
