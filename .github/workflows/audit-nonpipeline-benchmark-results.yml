name: Finalize complete benchmark consolidation

on:
  push:
    branches:
      - agent/fix-consolidated-reranked-metrics
    paths:
      - .github/workflows/audit-nonpipeline-benchmark-results.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-consolidated-reranked-metrics

      - name: Build complete canonical result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path('benchmark/embedding-v3')
          target = root / 'ALL_BENCHMARK_RESULTS.json'
          data = json.loads(target.read_text(encoding='utf-8'))
          required = ('MRR@10', 'HitRate@1', 'HitRate@10', 'nDCG@10')

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def summary_from(obj):
              for summary in (
                  obj.get('metrics', {}).get('summary'),
                  obj.get('evaluation', {}).get('metrics', {}).get('summary'),
              ):
                  if isinstance(summary, dict) and all(k in summary for k in required):
                      return summary
              raise ValueError('complete summary not found')

          def profile_id_from(obj, fallback):
              model = obj.get('model')
              if isinstance(model, dict):
                  return obj.get('id') or model.get('id') or fallback
              return obj.get('id') or fallback

          def runtime_from(obj):
              runtime = obj.get('runtime') if isinstance(obj.get('runtime'), dict) else {}
              def first(*keys):
                  for key in keys:
                      value = runtime.get(key)
                      if isinstance(value, (int, float)):
                          return float(value)
                  return None
              vram_mib = first('peak_vram_mib', 'gpu_used_mb')
              if vram_mib is None and isinstance(runtime.get('peak_vram_bytes'), (int, float)):
                  vram_mib = float(runtime['peak_vram_bytes']) / 1024 / 1024
              ram_mib = first('peak_rss_mib', 'ram_mb')
              return {
                  'load_seconds': first('load_seconds', 'startup_seconds'),
                  'document_encode_seconds': first('document_encode_seconds', 'doc_encode_seconds'),
                  'query_encode_seconds': first('query_encode_seconds'),
                  'documents_per_second': first('documents_per_second', 'docs_per_second'),
                  'queries_per_second': first('queries_per_second'),
                  'total_seconds': first('total_seconds'),
                  'peak_vram_mib': vram_mib,
                  'peak_ram_mib': ram_mib,
                  'device': runtime.get('device'),
                  'backend': runtime.get('backend') or obj.get('backend'),
                  'backend_version': runtime.get('version'),
              }

          def normalize(profile_id, source_path, source_group, obj, summary=None, runtime=None, extra=None):
              summary = summary or summary_from(obj)
              record = {
                  'profile_id': profile_id,
                  'source_group': source_group,
                  'source_path': source_path.as_posix(),
                  'metrics': {
                      'mrr_at_10': float(summary['MRR@10']),
                      'hit_rate_at_1': float(summary['HitRate@1']),
                      'hit_rate_at_10': float(summary['HitRate@10']),
                      'ndcg_at_10': float(summary['nDCG@10']),
                      'hit_rate_at_20': summary.get('HitRate@20'),
                      'hard_negative_error_rate': summary.get('hard_negative_error_rate'),
                  },
                  'runtime': runtime if runtime is not None else runtime_from(obj),
                  'metadata': {
                      'model': obj.get('model'),
                      'id': obj.get('id'),
                      'gate': obj.get('gate'),
                      'state': obj.get('state') or obj.get('status'),
                      'dataset': obj.get('dataset'),
                  },
              }
              if extra:
                  record['metadata'].update(extra)
              return record

          raw = []

          for source_group in ('gate2', 'gate3'):
              directory = root / 'results' / source_group
              for path in sorted(directory.glob('*.json')):
                  if path.name == 'summary.json':
                      continue
                  obj = load(path)
                  try:
                      summary = summary_from(obj)
                  except ValueError:
                      continue
                  raw.append(normalize(profile_id_from(obj, path.stem), path, source_group, obj, summary))

          for name in ('voyage-4-large.json', 'voyage-context-4.json'):
              path = root / 'results/voyage' / name
              obj = load(path)
              raw.append(normalize(profile_id_from(obj, path.stem), path, 'voyage_raw', obj))

          for profile_id, name in (
              ('nemotron_3_embed_1b_nvfp4', 'admission_nvfp4_full_cached_20260723.json'),
              ('nemotron_3_embed_1b_q4_k_m_gguf', 'admission_gguf_full_20260723_attempt2.json'),
          ):
              path = root / 'results/nemotron_audit_1_0_5' / name
              obj = load(path)
              raw.append(normalize(profile_id, path, 'nemotron_admission', obj))

          historical_path = root / 'results/reranker/summary.json'
          historical = load(historical_path)
          for pipeline in historical.get('pipelines', []):
              if pipeline.get('reranker_id') != 'none':
                  continue
              summary = pipeline.get('metrics', {}).get('summary')
              if not isinstance(summary, dict) or not all(k in summary for k in required):
                  continue
              profile_id = pipeline['embedding_variant']
              raw.append(normalize(
                  profile_id,
                  historical_path,
                  'historical_raw_none',
                  {'model': profile_id, 'id': profile_id, 'dataset': {'documents': 600, 'queries': 150}},
                  summary=summary,
                  runtime={},
                  extra={'historical_pipeline_id': pipeline.get('pipeline_id')},
              ))

          counts = {}
          for item in raw:
              counts[item['source_group']] = counts.get(item['source_group'], 0) + 1
          expected = {'gate2': 11, 'gate3': 16, 'voyage_raw': 2, 'nemotron_admission': 2, 'historical_raw_none': 5}
          if counts != expected:
              raise SystemExit(f'raw source counts mismatch: {counts} != {expected}')
          if len(raw) != 36:
              raise SystemExit(f'raw profile count mismatch: {len(raw)}')
          ids = [item['profile_id'] for item in raw]
          if len(ids) != len(set(ids)):
              duplicates = sorted({x for x in ids if ids.count(x) > 1})
              raise SystemExit(f'duplicate raw profile ids: {duplicates}')
          for required_id in ('qwen3_embedding_8b_gguf', 'nemotron_3_embed_1b_nvfp4', 'qwen3_embedding_4b_q8_0'):
              if required_id not in ids:
                  raise SystemExit(f'missing required raw profile: {required_id}')

          raw.sort(key=lambda x: (-x['metrics']['mrr_at_10'], -x['metrics']['ndcg_at_10'], -x['metrics']['hit_rate_at_1'], -x['metrics']['hit_rate_at_10'], x['profile_id']))
          for index, item in enumerate(raw, 1):
              item['rank_by_mrr_at_10'] = index

          reranked = data.get('pipelines_ranked_by_mrr_at_10') or data.get('published_pipelines_ranked_by_mrr_at_10')
          if not isinstance(reranked, list) or len(reranked) != 89:
              raise SystemExit(f'reranked pipeline count mismatch: {0 if not isinstance(reranked, list) else len(reranked)}')

          data['schema_version'] = '2.0.0'
          data['generated_at'] = datetime.now(timezone.utc).isoformat()
          data['canonical_scope'].update({
              'published_reranked_pipeline_artifacts': 89,
              'raw_embedding_profiles': 36,
              'benchmark_records_total': 125,
          })
          data['source_of_truth_policy'].update({
              'raw_embedding_metrics': 'Gate 2, Gate 3, Voyage raw, Nemotron admission, and historical reranker_id=none artifacts',
              'raw_and_reranked_are_ranked_separately': True,
          })
          data['raw_embedding_profiles_ranked_by_mrr_at_10'] = raw
          data['raw_embedding_profiles_by_id'] = {item['profile_id']: item for item in raw}
          data['raw_profile_source_counts'] = counts
          data['leaders_raw'] = {
              'best_by_mrr_at_10': raw[0],
              'fastest_documents_per_second': max((x for x in raw if isinstance(x['runtime'].get('documents_per_second'), (int, float))), key=lambda x: x['runtime']['documents_per_second']),
              'fastest_queries_per_second': max((x for x in raw if isinstance(x['runtime'].get('queries_per_second'), (int, float))), key=lambda x: x['runtime']['queries_per_second']),
          }
          data['nvfp4_artifact_scope'] = {
              'embedding_benchmark': 'nemotron_3_embed_1b_nvfp4',
              'generation_healthcheck_not_ranked': 'Ornith-9B-MTP-NVFP4:latest',
          }
          data['validation']['checks'].update({
              'raw_profile_count_36': True,
              'raw_source_counts_match': True,
              'qwen3_embedding_8b_present': True,
              'nemotron_nvfp4_present': True,
              'raw_and_reranked_separated': True,
              'temporary_files_removed_from_final_diff': True,
          })
          data['validation']['raw_profile_count'] = 36
          data['validation']['raw_profile_source_counts'] = counts
          target.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'reranked': 89, 'raw': 36, 'counts': counts, 'raw_leader': raw[0]['profile_id'], 'fastest_docs': data['leaders_raw']['fastest_documents_per_second']['profile_id']}, ensure_ascii=False))
          PY

      - name: Remove temporary audit artifacts
        run: |
          rm -f benchmark/embedding-v3/TEMP_NONPIPELINE_BENCHMARK_INVENTORY.json
          rm -f .github/workflows/audit-nonpipeline-benchmark-results.yml

      - name: Validate and commit final file only
        run: |
          python -m json.tool benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json >/dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json
          git add -u .github/workflows/audit-nonpipeline-benchmark-results.yml benchmark/embedding-v3/TEMP_NONPIPELINE_BENCHMARK_INVENTORY.json
          git commit -m "fix(benchmark): consolidate raw and reranked results"
          git push
