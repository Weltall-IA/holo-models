name: Archive superseded benchmark summaries

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/archive-superseded-benchmark-docs
          fetch-depth: 0

      - name: Move redundant summaries to archive
        run: |
          set -euo pipefail
          root='benchmark/embedding-v3'
          archive="$root/archive/superseded/2026-07-27"
          mkdir -p "$archive"

          if [ ! -f "$archive/BENCHMARK_RESULTS.json" ]; then
            git mv "$root/BENCHMARK_RESULTS.json" "$archive/BENCHMARK_RESULTS.json"
            git mv "$root/BENCHMARK_RESULTS_REGISTRY.json" "$archive/BENCHMARK_RESULTS_REGISTRY.json"
            git mv "$root/RERANKER_TOP5_REPORT.md" "$archive/RERANKER_TOP5_REPORT.md"
            git mv "$root/OPERATIONAL_COMPARISON_REPORT.md" "$archive/OPERATIONAL_COMPARISON_REPORT.md"

            cat > "$root/BENCHMARK_RESULTS.json" <<'EOF'
          {
            "schema_version": "1.0.0",
            "status": "SUPERSEDED",
            "canonical": "benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json",
            "archived_original": "benchmark/embedding-v3/archive/superseded/2026-07-27/BENCHMARK_RESULTS.json",
            "note": "Arquivo legado preservado apenas para compatibilidade de caminho. Não usar para ranking ou comparação atual."
          }
          EOF

            cat > "$root/BENCHMARK_RESULTS_REGISTRY.json" <<'EOF'
          {
            "schema_version": "1.0.0",
            "status": "SUPERSEDED",
            "canonical": "benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json",
            "archived_original": "benchmark/embedding-v3/archive/superseded/2026-07-27/BENCHMARK_RESULTS_REGISTRY.json",
            "note": "Registry histórico preservado apenas para compatibilidade de caminho. Os artefatos individuais continuam sendo a fonte autoritativa das métricas."
          }
          EOF

            cat > "$root/RERANKER_TOP5_REPORT.md" <<'EOF'
          # Relatório arquivado

          Este relatório foi substituído por `ALL_BENCHMARK_RESULTS.json`.

          Original preservado em `archive/superseded/2026-07-27/RERANKER_TOP5_REPORT.md`.
          EOF

            cat > "$root/OPERATIONAL_COMPARISON_REPORT.md" <<'EOF'
          # Relatório arquivado

          Esta comparação foi incorporada em `ALL_BENCHMARK_RESULTS.json`.

          Original preservado em `archive/superseded/2026-07-27/OPERATIONAL_COMPARISON_REPORT.md`.
          EOF

            cat > "$archive/README.md" <<'EOF'
          # Resumos de benchmark substituídos

          Esta pasta preserva documentos históricos que foram retirados da raiz para evitar múltiplas fontes concorrentes.

          Fonte canônica para inventário, ranking e comparação:

          `benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json`

          Fontes autoritativas das métricas:

          `benchmark/embedding-v3/results/reranker/pipelines/**/*.json`

          Arquivos preservados:

          - `BENCHMARK_RESULTS.json` — primeiro registro consolidado;
          - `BENCHMARK_RESULTS_REGISTRY.json` — registry intermediário append-only;
          - `RERANKER_TOP5_REPORT.md` — relatório da sessão Top-5;
          - `OPERATIONAL_COMPARISON_REPORT.md` — comparação operacional do PR #12.

          Estes arquivos não devem ser usados para escolher o líder atual. Permanecem somente para auditoria histórica e rastreabilidade.
          EOF

            python - <<'PY'
          from pathlib import Path

          path = Path('benchmark/embedding-v3/README.md')
          text = path.read_text(encoding='utf-8')
          section = '''

          ## Fonte canônica consolidada

          Para inventário, ranking e comparação de embeddings e rerankers, consulte somente:

          `ALL_BENCHMARK_RESULTS.json`

          Os artefatos individuais em `results/reranker/pipelines/` continuam sendo a fonte autoritativa das métricas. Registros e relatórios anteriores foram movidos para `archive/superseded/`; os caminhos antigos contêm apenas avisos de compatibilidade e não devem ser usados como leaderboard.
          '''
          if '## Fonte canônica consolidada' not in text:
              path.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          PY
          fi

      - name: Validate cleanup
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('benchmark/embedding-v3')
          archive = root / 'archive/superseded/2026-07-27'
          canonical = json.loads((root / 'ALL_BENCHMARK_RESULTS.json').read_text(encoding='utf-8'))
          assert canonical['inventory']['published_pipeline_count'] == 89
          assert canonical['inventory']['unique_embedding_count'] == 32
          assert len(canonical['published_pipelines_ranked_by_mrr_at_10']) == 89

          for name in ('BENCHMARK_RESULTS.json', 'BENCHMARK_RESULTS_REGISTRY.json'):
              archived = json.loads((archive / name).read_text(encoding='utf-8'))
              stub = json.loads((root / name).read_text(encoding='utf-8'))
              assert archived
              assert stub['status'] == 'SUPERSEDED'
              assert stub['canonical'].endswith('ALL_BENCHMARK_RESULTS.json')

          for name in ('RERANKER_TOP5_REPORT.md', 'OPERATIONAL_COMPARISON_REPORT.md'):
              assert (archive / name).stat().st_size > 1000
              assert 'arquivado' in (root / name).read_text(encoding='utf-8').lower()

          assert (archive / 'README.md').exists()
          assert '## Fonte canônica consolidada' in (root / 'README.md').read_text(encoding='utf-8')
          PY

          test "$(find benchmark/embedding-v3/results/reranker/pipelines -type f -name '*.json' | wc -l)" -eq 89
          test -z "$(git diff --name-only origin/master...HEAD -- benchmark/embedding-v3/results)"

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark/embedding-v3
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(benchmark): archive superseded benchmark summaries'
          git push origin HEAD:agent/archive-superseded-benchmark-docs
