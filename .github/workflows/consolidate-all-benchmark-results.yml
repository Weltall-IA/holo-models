name: Consolidate all benchmark results

on:
  push:
    branches:
      - agent/consolidate-all-benchmark-results-v2
    paths:
      - benchmark/embedding-v3/tools/consolidate_all_benchmark_results.py
      - .github/workflows/consolidate-all-benchmark-results.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidate-all-benchmark-results-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate consolidated benchmark file
        run: python benchmark/embedding-v3/tools/consolidate_all_benchmark_results.py

      - name: Validate generated JSON and counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['inventory']['published_pipeline_count'] == 89
          assert data['inventory']['unique_embedding_count'] == 32
          assert len(data['published_pipelines_ranked_by_mrr_at_10']) == 89
          assert len(data['embedding_index']) == 32
          print('validated:', path)
          PY

      - name: Commit generated file
        run: |
          if git diff --quiet -- benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json; then
            echo 'Generated file is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json
          git commit -m 'docs(benchmark): consolidate all 89 pipeline results'
          git push origin HEAD:agent/consolidate-all-benchmark-results-v2
