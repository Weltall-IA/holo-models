name: reranker-v2-static

on:
  pull_request:
    paths:
      - 'benchmarks/reranker-v2-unbiased/**'
      - '.github/workflows/reranker-v2-static.yml'
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/reranker-v2-unbiased
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile benchmark
        run: python -m py_compile metrics.py holo_gold.py prepare_general.py prepare_holo.py run_benchmark.py report.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
