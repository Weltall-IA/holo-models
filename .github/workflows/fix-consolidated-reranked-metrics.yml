name: Fix consolidated reranked metrics

on:
  push:
    branches:
      - agent/fix-consolidated-reranked-metrics

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-consolidated-reranked-metrics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correct ranking and indices
        run: python benchmark/embedding-v3/tools/fix_consolidated_reranked_metrics.py

      - name: Validate corrected canonical file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          ranking = data['published_pipelines_ranked_by_mrr_at_10']
          assert len(ranking) == 89
          assert ranking[0]['pipeline_id'] == 'embeddinggemma_768_float32__voyage_rerank_2_5'
          assert abs(ranking[0]['metrics']['mrr_at_10'] - 0.8264444444444444) < 1e-12
          assert ranking[1]['pipeline_id'] == 'voyage_4_large_1024_float32__voyage_rerank_2_5'
          assert ranking[2]['pipeline_id'] == 'qwen3_embedding_4b_q8_0__qwen_local'
          assert data['validation']['checks']['reranked_metric_selection_corrected'] is True
          assert not any(item['missing_required_metrics'] for item in ranking)
          print('PASS', ranking[0]['pipeline_id'], ranking[0]['metrics']['mrr_at_10'])
          PY

      - name: Commit corrected canonical file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark/embedding-v3/ALL_BENCHMARK_RESULTS.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(benchmark): rank historical pipelines by reranked metrics'
          git push origin HEAD:agent/fix-consolidated-reranked-metrics
